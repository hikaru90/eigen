<!doctype html>

<html lang="%paraglide.lang%" dir="%paraglide.dir%">
	<head>
		<meta charset="utf-8" />

		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover"
		/>
		<meta name="mobile-web-app-capable" content="yes" />

		<meta name="theme-color" content="#e8ede5" />
		<meta name="description" content="Self-hostable memory infrastructure" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<link
			rel="apple-touch-icon"
			href="/apple-touch-icon-dark.png"
			media="(prefers-color-scheme: dark)"
		/>

		<meta name="text-scale" content="scale" />
		<script>
			(function () {
				var pref = localStorage.getItem("theme-preference");
				var isDark =
					pref === "dark" ||
					(pref !== "light" &&
						window.matchMedia("(prefers-color-scheme: dark)").matches);
				if (isDark) {
					document.documentElement.classList.add("dark");
					document.documentElement.style.colorScheme = "dark";
				} else {
					document.documentElement.style.colorScheme = "light";
				}
				var themeMeta = document.querySelector('meta[name="theme-color"]');
				if (themeMeta) {
					themeMeta.setAttribute(
						"content",
						isDark ? "oklch(0.141 0.005 285.823)" : "#e8ede5"
					);
				}
			})();
		</script>
		%sveltekit.head%
	</head>

	<body data-sveltekit-preload-data="hover"><div style="display: contents">%sveltekit.body%</div></body>
</html>
