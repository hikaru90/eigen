<!doctype html>

<html lang="%paraglide.lang%" dir="%paraglide.dir%">
  <head>
    <meta charset="utf-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Eigen Mesh" />
    <meta name="application-name" content="Eigen Mesh" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- system bars follow the system setting (Auto); a forced look rewrites both (src/lib/pwa/theme-color.ts) -->
    <meta name="theme-color" content="#e8ede5" media="(prefers-color-scheme: light)" id="theme-color-light" />
    <meta name="theme-color" content="#141c16" media="(prefers-color-scheme: dark)" id="theme-color-dark" />
    <meta name="description" content="Self-hostable memory infrastructure" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link
      rel="apple-touch-icon"
      href="/apple-touch-icon-dark.png"
      media="(prefers-color-scheme: dark)"
    />

    <meta name="text-scale" content="scale" />
    <script>
      ;(function () {
        var pref = localStorage.getItem('theme-preference')
        var isDark =
          pref === 'dark' ||
          (pref !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        if (isDark) {
          document.documentElement.classList.add('dark')
          document.documentElement.style.colorScheme = 'dark'
        } else {
          document.documentElement.style.colorScheme = 'light'
        }
        if (pref === 'light' || pref === 'dark') {
          var forced = pref === 'dark' ? '#141c16' : '#e8ede5'
          document.getElementById('theme-color-light').setAttribute('content', forced)
          document.getElementById('theme-color-dark').setAttribute('content', forced)
        }
        var isStandalone =
          window.matchMedia('(display-mode: standalone)').matches ||
          window.matchMedia('(display-mode: fullscreen)').matches ||
          window.matchMedia('(display-mode: minimal-ui)').matches ||
          window.navigator.standalone === true
        if (isStandalone) {
          document.documentElement.classList.add('pwa-standalone')
        }
      })()
    </script>
    <script>
      // Chrome fires beforeinstallprompt before the app hydrates; keep it for the install
      // store (src/lib/pwa/deferred-install-store.svelte.ts) so one-click install works.
      window.addEventListener('beforeinstallprompt', function (event) {
        event.preventDefault()
        window.__eigenInstallPrompt = event
      })
      window.addEventListener('appinstalled', function () {
        window.__eigenInstallPrompt = null
      })
    </script>
    %sveltekit.head%
  </head>

  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
