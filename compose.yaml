# Self-hosted Postgres for Eigen (pgvector + Apache AGE).
services:
  falkordb:
    container_name: eigen-falkordb
    image: falkordb/falkordb:latest
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli ping | grep PONG']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped
  db:
    container_name: eigen-db
    build:
      context: .
      dockerfile: Dockerfile.postgres
    environment:
      POSTGRES_USER: eigen
      POSTGRES_PASSWORD: eigen
      POSTGRES_DB: eigen
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U eigen -d eigen']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    volumes:
      - eigen_pg:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    restart: unless-stopped
  app:
    container_name: eigen-app
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
      falkordb:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://eigen:eigen@db:5432/eigen
      FALKOR_HOST: falkordb
      FALKOR_PORT: 6379
      FALKOR_GRAPH: eigen_memory
      ORIGIN: http://localhost:3000
      HOST: 0.0.0.0
      PORT: 3000
    env_file:
      - .env
    ports:
      - '3000:3000'
    restart: unless-stopped

volumes:
  eigen_pg:
