name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  DATABASE_URL: postgres://eigen:eigen@localhost:5432/eigen
  DATABASE_ADMIN_URL: postgres://eigen:eigen@localhost:5432/eigen
  POSTGRES_USER: eigen
  POSTGRES_PASSWORD: eigen
  APP_DB_ROLE: eigen_app
  EIGEN_APP_DB_PASSWORD: eigen_app
  AGE_GRAPH_NAME: eigen_graph
  BETTER_AUTH_SECRET: ci-test-better-auth-secret-min-32-chars
  ORIGIN: http://localhost:4173
  TENANT_MASTER_KEY: ci-test-tenant-master-key-32chars!!
  LLM_RULE_CHAT: 00000000-0000-4000-8000-000000000001
  LLM_RULE_EMBEDDING: 00000000-0000-4000-8000-000000000002

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  unit-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run test:coverage

  e2e-smoke:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, unit-coverage]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - name: Start Postgres (pgvector + AGE)
        run: docker compose up -d --build db
      - run: npm run db:wait
      - run: npm run db:migrate
      - run: npm run db:app-role
      - run: npm run db:rls
      - run: npm run test:e2e:smoke
