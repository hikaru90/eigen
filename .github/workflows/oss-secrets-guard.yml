name: OSS secrets guard

on:
  push:
    branches: [main]
  pull_request:

jobs:
  assert-no-operator-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm

      - run: npm ci

      - name: Assert open-source tree has no operator API keys
        run: npm run assert:oss-secrets

      - name: Unit tests for OSS secret guard
        run: npm run test:unit -- scripts/assert-oss-no-secrets.spec.ts
