# Self-hosted Postgres for Eigen (pgvector + Apache AGE).
services:
  falkordb:
    container_name: eigen-falkordb
    image: falkordb/falkordb:latest
    ports:
      - '6379:6379'
      # FalkorDB image also serves a browser UI on 3000 inside the container; map to 3001
      # so `app` can use host port 3000 when you run the full stack (`npm run stack:up`).
      - '3001:3000'
    environment:
      # Same variable the app uses; compose substitutes from your shell or root `.env`.
      FALKOR_PASSWORD: ${FALKOR_PASSWORD:-eigen_falkor_dev}
      REDIS_ARGS: --requirepass ${FALKOR_PASSWORD:-eigen_falkor_dev}
      # Browser UI is Next.js + NextAuth; must match the URL you open in the browser (host port 3001 above).
      # If this is wrong, login often fails with a generic "Invalid credentials" even when Redis auth is correct.
      NEXTAUTH_URL: http://localhost:3001
      # Browser persists encrypted session credentials; must be exactly 64 hex chars (32 bytes). Required in `.env`.
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$FALKOR_PASSWORD" ping | grep -q PONG']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    volumes:
      - eigen_falkor:/data
    restart: unless-stopped
  db:
    container_name: eigen-db
    build:
      context: .
      dockerfile: Dockerfile.postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eigen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eigen}
      POSTGRES_DB: eigen
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-eigen} -d eigen']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    volumes:
      - eigen_pg:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    restart: unless-stopped
  app:
    container_name: eigen-app
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
      falkordb:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://eigen:eigen@db:5432/eigen}
      FALKOR_HOST: ${FALKOR_HOST:-falkordb}
      FALKOR_PORT: ${FALKOR_PORT:-6379}
      FALKOR_GRAPH: ${FALKOR_GRAPH:-eigen_memory}
      FALKOR_PASSWORD: ${FALKOR_PASSWORD:-eigen_falkor_dev}
      HOST: 0.0.0.0
      PORT: 3000
    env_file:
      - .env
    ports:
      - '3000:3000'
    restart: unless-stopped
  migrate:
    container_name: eigen-migrate
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://eigen:eigen@db:5432/eigen}
    env_file:
      - .env
    command: sh -c "npx drizzle-kit push --force && node scripts/apply-rls.mjs"
    profiles:
      - migrate

volumes:
  eigen_pg:
  eigen_falkor:
