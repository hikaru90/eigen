# Self-hosted Postgres for Eigen (pgvector + Apache AGE + pg_cron + pg_net).
services:
  db:
    container_name: eigen-db
    build:
      context: .
      dockerfile: Dockerfile.postgres
    command:
      - postgres
      - -c
      - shared_preload_libraries=age,pg_cron,pg_net
      - -c
      - cron.database_name=eigen
      - -c
      - cron.timezone=${CONSOLIDATION_CRON_TZ:-UTC}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eigen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eigen}
      POSTGRES_DB: eigen
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-eigen} -d eigen']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    volumes:
      - eigen_pg:/var/lib/postgresql/data
    restart: unless-stopped
  app:
    container_name: eigen-app
    build:
      context: .
      dockerfile: Dockerfile
      args:
        POSTHOG_CLI_API_KEY: ${POSTHOG_CLI_API_KEY:-${POSTHOG_PERSONAL_API_KEY:-}}
        POSTHOG_PERSONAL_API_KEY: ${POSTHOG_PERSONAL_API_KEY:-}
        POSTHOG_CLI_PROJECT_ID: ${POSTHOG_CLI_PROJECT_ID:-208285}
        POSTHOG_SOURCEMAPS_REQUIRED: ${POSTHOG_SOURCEMAPS_REQUIRED:-0}
        SOURCE_VERSION: ${SOURCE_COMMIT:-${SOURCE_VERSION:-unknown}}
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://eigen:eigen@db:5432/eigen}
      DATABASE_ADMIN_URL: ${DATABASE_ADMIN_URL:-postgres://eigen:eigen@db:5432/eigen}
      CONSOLIDATION_INTERNAL_URL: ${CONSOLIDATION_INTERNAL_URL:-http://app:3000}
      APP_DB_ROLE: ${APP_DB_ROLE:-eigen_app}
      AGE_GRAPH_NAME: ${AGE_GRAPH_NAME:-eigen_graph}
      ADMIN_NAME: ${ADMIN_NAME:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      HOST: 0.0.0.0
      PORT: 3000
    env_file:
      - .env
    ports:
      - '3000:3000'
    restart: unless-stopped

volumes:
  eigen_pg:
