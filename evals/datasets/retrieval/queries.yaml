# Hand-authored eval queries with graded relevance labels.
#
# Categories:
#   semantic_paraphrase  -> wording diverges from corpus, no shared named entities (favors vector).
#   entity_relation      -> asks about a named entity or a connection (favors graph expansion).
#   hybrid               -> mixed signal; should land between the two extremes.
#
# Grades: 3 = direct answer, 2 = clearly relevant, 1 = tangential.
# Unlabeled corpus thoughts are implicitly grade 0.

