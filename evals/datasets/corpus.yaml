# Unified eval corpus.
#
# Stable string IDs (ec_NNN) are mapped to UUIDs at seed time by the harness
# via metadata.evalId. All thoughts are ingested through captureThought() so
# the corpus always reflects real pipeline behaviour.
#
# Clusters:
#   A. Sourdough / cooking (Marcus, Tartine)
#   B. Eigen engineering work (Sarah)
#   C. Strength training (Diego)
#   D. Climbing / outdoors (Tom)
#   E. Books and ideas (Priya)
#   F. Finance and admin
#   G. Temporal sequence (D2 — temporal reasoning)
#   H. Contradiction pairs (D7 — contradiction detection)
#   I. Staleness / decay (D10 — memory decay)
#   J. Personalization signals (D4 — personalization)
#   K. Golden layer-eval thoughts (human-labeled entity/relation ground truth)
#   L. Alex / Eigen agent context (bridge thoughts, cross-cluster)
#
# Fields:
#   id         — stable string id, never reused
#   rawText    — the raw thought as a user would type it
#   cluster    — letter code above
#   golden     — true if this thought has human-labeled expected.* ground truth
#   createdAt  — optional ISO-8601 for deterministic temporal eval
#   expected   — (golden only) human-labeled category, entities, relations

