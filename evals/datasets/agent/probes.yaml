retrieval:
  # direct_recall (4): paraphrase of a single stored thought, tests basic memory
  - id: p_r_001
    category: direct_recall
    text: "What memory eval framework is being built?"
    relevant:
      - { id: a_001, grade: 3 }
      - { id: a_002, grade: 1 }

  - id: p_r_002
    category: direct_recall
    text: "What is Alex's morning reading habit?"
    relevant:
      - { id: a_004, grade: 3 }

  - id: p_r_003
    category: direct_recall
    text: "Which book is Alex currently reading?"
    relevant:
      - { id: a_005, grade: 3 }

  - id: p_r_004
    category: direct_recall
    text: "What is the Recall@3 performance goal for the agent eval?"
    relevant:
      - { id: a_009, grade: 3 }

  # entity_relation (3): tests that entity extraction and graph expansion worked
  - id: p_r_005
    category: entity_relation
    text: "What was decided at the Berlin meeting?"
    relevant:
      - { id: a_008, grade: 3 }
      - { id: a_006, grade: 2 }

  - id: p_r_006
    category: entity_relation
    text: "How is Alex connected to the eigen project?"
    relevant:
      - { id: a_007, grade: 3 }
      - { id: a_001, grade: 1 }

  - id: p_r_007
    category: entity_relation
    text: "What triggered the addition of graph retrieval to eigen?"
    relevant:
      - { id: a_008, grade: 3 }
      - { id: a_006, grade: 1 }

qa:
  # synthesis_qa (3): multi-thought answers, judged by LLM-as-judge
  - id: p_qa_001
    question: "Why was the decision made to use fresh eval users per run?"
    expected_facts:
      - "Fresh eval users ensure cold-start agent behavior"
      - "Tests reflect real agent experience"

  - id: p_qa_002
    question: "What is Alex's relationship to the eigen memory system and what does he use it for?"
    expected_facts:
      - "Alex is the primary user of eigen"
      - "Alex uses it to track project decisions"

  - id: p_qa_003
    question: "What came out of the Berlin meeting regarding the eigen architecture?"
    expected_facts:
      - "The meeting was in Berlin in March"
      - "Graph-based retrieval was added as a result of the meeting"
